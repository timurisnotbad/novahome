<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Nova Home — панель управления</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<!-- login -->
<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="brand">NOVA<span>HOME</span></div>
    <h1>Панель управления</h1>
    <p class="muted">Вход только для владельца.</p>
    <form id="lgForm" novalidate>
      <label>Логин<input id="lgUser" type="email" inputmode="email" autocomplete="username" placeholder="email"></label>
      <label>Пароль<span class="pw"><input id="lgPass" type="password" autocomplete="current-password"><button type="button" class="eye" id="lgEye" aria-label="Показать пароль"><i class="ph-bold ph-eye"></i></button></span></label>
      <button class="btn primary w100" id="lgGo" type="submit"><i class="ph-bold ph-sign-in"></i>Войти</button>
    </form>
    <div class="err" id="lgErr" hidden></div>
  </div>
</div>

<!-- app -->
<div id="app" hidden>
  <header class="top">
    <a class="brand" href="index.html" target="_blank" rel="noopener">NOVA<span>HOME</span></a>
    <nav class="tabs" id="tabs">
      <button data-t="today" class="on">Сегодня</button>
      <button data-t="listings">Объявления</button>
      <button data-t="bookings">Брони</button>
      <button data-t="guests">Гости</button>
      <button data-t="blog">Блог</button>
      <button data-t="promos">Акции</button>
      <button data-t="stats">Статистика</button>
      <button data-t="log">Журнал</button>
    </nav>
    <div class="top-r">
      <span class="saved" id="saveState"></span>
      <button class="btn ghost" id="discard" hidden>Отменить изменения</button>
      <button class="btn dark" id="publish"><i class="ph-bold ph-upload-simple"></i><span class="txt">Опубликовать</span><span class="dot" id="pubDot" hidden></span></button>
      <button class="icon" id="logout" title="Выйти"><i class="ph-bold ph-sign-out"></i></button>
    </div>
  </header>

  <main id="view"></main>
</div>

<!-- photo upload modal -->
<div id="upModal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-h"><button class="icon" id="upX"><i class="ph-bold ph-x"></i></button><div><b>Загрузка фото</b><small id="upSub">Ничего не выбрано</small></div><button class="icon" id="upAdd"><i class="ph-bold ph-plus"></i></button></div>
    <div class="drop" id="drop"><i class="ph-fill ph-images"></i><b>Перетащите файлы</b><span>или найдите фото на компьютере</span><button class="btn dark" id="upBrowse">Выбрать</button><input type="file" id="upFile" accept="image/*,.heic,.heif,image/heic,image/heif" multiple hidden></div>
    <div class="up-list" id="upList"></div>
    <div class="modal-f"><span class="muted small">Фото сжимаются в браузере до 1600 px WebP — сайт останется быстрым</span><button class="btn primary" id="upGo" disabled>Загрузить</button></div>
  </div>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true"></div></div>
<nav class="mtabs" id="mtabs" aria-label="Разделы"></nav>
<div id="toast" class="toast" hidden></div>
<script>window.NV_BOOK_API='https://novahome-booking.timurzakirov200528.workers.dev';</script>
<script src="map.js"></script>
<script src="admin.js"></script>
</body></html>
